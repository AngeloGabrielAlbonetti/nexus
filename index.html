<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Rede Social</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f0f0f;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #e0e0e0;
            overflow: hidden;
        }

        body.light {
            background: #f5f5f5;
            color: #1a1a1a;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 280px;
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem 1.5rem;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        body.light .sidebar {
            background: rgba(255, 255, 255, 0.8);
            border-right-color: rgba(0, 0, 0, 0.1);
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 3rem;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 800;
            color: #fff;
        }

        .nav-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 15px;
            color: #999;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }

        .nav-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: -1;
        }

        .nav-btn:hover {
            color: #e0e0e0;
            border-color: rgba(0, 212, 255, 0.3);
        }

        .nav-btn.active {
            color: #fff;
            border-color: rgba(0, 212, 255, 0.5);
            background: rgba(0, 212, 255, 0.1);
            font-weight: 600;
        }

        body.light .nav-btn {
            color: #666;
        }

        body.light .nav-btn:hover {
            color: #1a1a1a;
            border-color: rgba(124, 58, 237, 0.3);
        }

        body.light .nav-btn.active {
            color: #000;
            border-color: rgba(124, 58, 237, 0.5);
            background: rgba(124, 58, 237, 0.1);
        }

        .nav-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .sidebar-bottom {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        body.light .sidebar-bottom {
            border-top-color: rgba(0, 0, 0, 0.1);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 10px;
            background: rgba(0, 212, 255, 0.05);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        body.light .user-profile {
            background: rgba(124, 58, 237, 0.05);
        }

        .user-profile:hover {
            background: rgba(0, 212, 255, 0.1);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
            font-size: 16px;
            flex-shrink: 0;
        }

        .user-info {
            flex: 1;
            min-width: 0;
        }

        .user-name {
            font-size: 13px;
            font-weight: 600;
            color: #e0e0e0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        body.light .user-name {
            color: #1a1a1a;
        }

        .user-handle {
            font-size: 12px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 14px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px 16px;
            color: #999;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            font-size: 15px;
        }

        body.light .theme-toggle {
            border-color: rgba(0, 0, 0, 0.1);
            color: #666;
        }

        .theme-toggle:hover {
            border-color: rgba(0, 212, 255, 0.3);
            color: #e0e0e0;
        }

        body.light .theme-toggle:hover {
            border-color: rgba(124, 58, 237, 0.3);
            color: #1a1a1a;
        }

        /* MAIN */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0a0a0a;
            overflow: hidden;
        }

        body.light .main {
            background: #fafafa;
        }

        .header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1.5rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
        }

        body.light .header {
            background: rgba(255, 255, 255, 0.8);
            border-bottom-color: rgba(0, 0, 0, 0.1);
        }

        .header-title {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .search-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 14px;
            color: #e0e0e0;
            font-family: inherit;
            transition: all 0.3s ease;
            width: 250px;
        }

        body.light .search-box {
            background: rgba(0, 0, 0, 0.05);
            border-color: rgba(0, 0, 0, 0.1);
            color: #1a1a1a;
        }

        .search-box::placeholder {
            color: #666;
        }

        .search-box:focus {
            outline: none;
            border-color: rgba(0, 212, 255, 0.5);
            background: rgba(0, 212, 255, 0.05);
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
        }

        /* HOME FEED */
        .feed-container {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            gap: 1.5rem;
        }

        .post-card {
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            animation: slideIn 0.3s ease;
        }

        body.light .post-card {
            background: rgba(255, 255, 255, 0.8);
            border-color: rgba(0, 0, 0, 0.1);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .post-card:hover {
            border-color: rgba(0, 212, 255, 0.3);
            background: rgba(30, 30, 30, 1);
        }

        body.light .post-card:hover {
            border-color: rgba(124, 58, 237, 0.3);
            background: rgba(255, 255, 255, 1);
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1rem;
        }

        .post-avatar {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
            flex-shrink: 0;
        }

        .post-meta {
            flex: 1;
        }

        .post-author {
            font-size: 14px;
            font-weight: 600;
            color: #e0e0e0;
        }

        body.light .post-author {
            color: #1a1a1a;
        }

        .post-time {
            font-size: 12px;
            color: #666;
        }

        .post-image {
            width: 100%;
            aspect-ratio: 16/9;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(124, 58, 237, 0.1));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .post-image:hover {
            border-color: rgba(0, 212, 255, 0.3);
            transform: scale(1.02);
        }

        .post-text {
            font-size: 14px;
            line-height: 1.6;
            color: #b0b0b0;
            margin-bottom: 1rem;
        }

        body.light .post-text {
            color: #555;
        }

        .post-actions {
            display: flex;
            gap: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        body.light .post-actions {
            border-top-color: rgba(0, 0, 0, 0.1);
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 6px 12px;
            color: #999;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        body.light .action-btn {
            border-color: rgba(0, 0, 0, 0.1);
            color: #666;
        }

        .action-btn:hover {
            border-color: rgba(0, 212, 255, 0.3);
            color: #00d4ff;
            background: rgba(0, 212, 255, 0.05);
        }

        body.light .action-btn:hover {
            border-color: rgba(124, 58, 237, 0.3);
            color: #7c3aed;
            background: rgba(124, 58, 237, 0.05);
        }

        /* EXPLORE GRID */
        .explore-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .explore-card {
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            height: 240px;
            display: flex;
            flex-direction: column;
        }

        body.light .explore-card {
            background: rgba(255, 255, 255, 0.8);
            border-color: rgba(0, 0, 0, 0.1);
        }

        .explore-card:hover {
            border-color: rgba(0, 212, 255, 0.3);
            transform: translateY(-4px);
        }

        .explore-image {
            flex: 1;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(124, 58, 237, 0.1));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        body.light .explore-image {
            border-bottom-color: rgba(0, 0, 0, 0.1);
        }

        .explore-info {
            padding: 1rem;
        }

        .explore-title {
            font-size: 14px;
            font-weight: 600;
            color: #e0e0e0;
            margin-bottom: 4px;
        }

        body.light .explore-title {
            color: #1a1a1a;
        }

        .explore-users {
            font-size: 12px;
            color: #666;
        }

        /* PROFILE VIEW */
        .profile-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 48px;
            font-weight: 700;
            margin: 0 auto 1rem;
        }

        .profile-name {
            font-size: 24px;
            font-weight: 700;
            color: #e0e0e0;
            margin-bottom: 4px;
        }

        body.light .profile-name {
            color: #1a1a1a;
        }

        .profile-handle {
            font-size: 14px;
            color: #666;
            margin-bottom: 1rem;
        }

        .profile-bio {
            font-size: 14px;
            color: #b0b0b0;
            max-width: 400px;
            margin: 0 auto 1rem;
        }

        body.light .profile-bio {
            color: #555;
        }

        .profile-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            max-width: 400px;
            margin: 0 auto 2rem;
        }

        .stat-box {
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
        }

        body.light .stat-box {
            background: rgba(255, 255, 255, 0.8);
            border-color: rgba(0, 0, 0, 0.1);
        }

        .stat-number {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        .profile-btn {
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            display: inline-block;
        }

        .profile-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 212, 255, 0.3);
        }

        /* MESSAGES VIEW */
        .messages-list {
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .message-item {
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        body.light .message-item {
            background: rgba(255, 255, 255, 0.8);
            border-color: rgba(0, 0, 0, 0.1);
        }

        .message-item:hover {
            border-color: rgba(0, 212, 255, 0.3);
            background: rgba(30, 30, 30, 1);
        }

        .message-avatar {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
            flex-shrink: 0;
        }

        .message-content {
            flex: 1;
        }

        .message-name {
            font-size: 14px;
            font-weight: 600;
            color: #e0e0e0;
            margin-bottom: 4px;
        }

        body.light .message-name {
            color: #1a1a1a;
        }

        .message-text {
            font-size: 13px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* SETTINGS VIEW */
        .settings-list {
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .settings-item {
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        body.light .settings-item {
            background: rgba(255, 255, 255, 0.8);
            border-color: rgba(0, 0, 0, 0.1);
        }

        .settings-item:hover {
            border-color: rgba(0, 212, 255, 0.3);
        }

        .settings-label {
            font-size: 14px;
            font-weight: 500;
            color: #e0e0e0;
        }

        body.light .settings-label {
            color: #1a1a1a;
        }

        .toggle {
            width: 44px;
            height: 24px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toggle.on {
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
        }

        .toggle-dot {
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: all 0.3s ease;
        }

        .toggle.on .toggle-dot {
            left: 22px;
        }

        /* CHAT VIEW */
        .chat-layout {
            display: flex;
            height: 100%;
            gap: 0;
            max-width: 900px;
            margin: 0 auto;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            overflow: hidden;
        }

        body.light .chat-layout {
            border-color: rgba(0,0,0,0.1);
        }

        .chat-contacts {
            width: 280px;
            flex-shrink: 0;
            border-right: 1px solid rgba(255,255,255,0.1);
            overflow-y: auto;
            background: rgba(20,20,20,0.6);
        }

        body.light .chat-contacts {
            background: rgba(245,245,245,0.8);
            border-right-color: rgba(0,0,0,0.1);
        }

        .chat-contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        body.light .chat-contact-item {
            border-bottom-color: rgba(0,0,0,0.05);
        }

        .chat-contact-item:hover {
            background: rgba(0, 212, 255, 0.08);
        }

        .chat-contact-item.active {
            background: rgba(0, 212, 255, 0.12);
            border-left: 3px solid #00d4ff;
        }

        body.light .chat-contact-item.active {
            background: rgba(124,58,237,0.1);
            border-left-color: #7c3aed;
        }

        .chat-contact-info {
            flex: 1;
            min-width: 0;
        }

        .chat-contact-name {
            font-size: 14px;
            font-weight: 600;
            color: #e0e0e0;
        }

        body.light .chat-contact-name {
            color: #1a1a1a;
        }

        .chat-contact-preview {
            font-size: 12px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .chat-window {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(10,10,10,0.5);
        }

        body.light .chat-window {
            background: rgba(255,255,255,0.7);
        }

        .chat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            background: rgba(20,20,20,0.6);
        }

        body.light .chat-header {
            background: rgba(245,245,245,0.8);
            border-bottom-color: rgba(0,0,0,0.1);
        }

        .chat-header-name {
            font-size: 15px;
            font-weight: 600;
            color: #e0e0e0;
        }

        body.light .chat-header-name {
            color: #1a1a1a;
        }

        .chat-header-status {
            font-size: 12px;
            color: #00d4ff;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #555;
            gap: 12px;
        }

        .chat-empty-icon {
            font-size: 48px;
            opacity: 0.5;
        }

        .chat-empty-text {
            font-size: 14px;
        }

        .chat-bubble {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
            animation: bubbleIn 0.2s ease;
        }

        @keyframes bubbleIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-bubble.sent {
            align-self: flex-end;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .chat-bubble.received {
            align-self: flex-start;
            background: rgba(40,40,40,0.9);
            color: #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        body.light .chat-bubble.received {
            background: rgba(230,230,230,0.9);

        .modal-overlay {

            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }

        .modal-box {
            background: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px;

            max-width: 95vw;
            animation: slideUp 0.25s ease;

            background: #ffffff;
            border-color: rgba(0,0,0,0.1);

        @keyframes slideUp {

            to { transform: translateY(0); opacity: 1; }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);

            -webkit-text-fill-color: transparent;

            justify-content: center;
            color: #fff;
            font-size: 32px;

        .edit-avatar-overlay {

            font-size: 14px;
            color: #e0e0e0;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;

            background: rgba(0,212,255,0.06);
            color: #00d4ff;
        }

        body.light .share-option:hover {
            border-color: rgba(124,58,237,0.3);
            background: rgba(124,58,237,0.06);
            color: #7c3aed;
        }

        .share-link-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .share-link-input {
            flex: 1;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 9px 12px;
            font-size: 12px;
            color: #888;
            font-family: inherit;
            outline: none;
        }

        body.light .share-link-input {
            background: rgba(0,0,0,0.04);
            border-color: rgba(0,0,0,0.1);
        }

        .share-copy-btn {
            padding: 9px 16px;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .share-copy-btn:hover { transform: translateY(-1px); }

        .share-close {
            display: block;
            width: 100%;
            margin-top: 1rem;
            padding: 10px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #666;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }

        body.light .share-close { border-color: rgba(0,0,0,0.1); }
        .share-close:hover { color: #e0e0e0; border-color: rgba(255,255,255,0.2); }

        /* HOME LAYOUT WITH RIGHT SIDEBAR */
        .home-layout {
            display: flex;
            gap: 1.5rem;
            max-width: 1100px;
            margin: 0 auto;
            align-items: flex-start;
        }

        .home-feed { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1.5rem; }

        .home-right {
            width: 260px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            position: sticky;
            top: 0;
        }

        .home-right-card {
            background: rgba(22,22,22,0.9);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 1.2rem;
        }

        body.light .home-right-card {
            background: rgba(255,255,255,0.9);
            border-color: rgba(0,0,0,0.08);
        }

        .action-btn.active {
            color: #00d4ff;
            border-color: rgba(0,212,255,0.3);
            background: rgba(0,212,255,0.06);
        }

        body.light .action-btn.active {
            color: #7c3aed;
            border-color: rgba(124,58,237,0.3);
            background: rgba(124,58,237,0.06);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 70px;
                padding: 1rem 0.5rem;
            }

            .nav-btn {
                padding: 12px 8px;
                justify-content: center;
                gap: 0;
            }

            .nav-btn span:last-child {
                display: none;
            }

            .logo {
                justify-content: center;
                margin-bottom: 2rem;
            }

            .logo span:last-child {
                display: none;
            }

            .user-profile {
                padding: 8px;
                flex-direction: column;
                gap: 4px;
            }

            .user-info {
                display: none;
            }

            .theme-toggle span:last-child {
                display: none;
            }

            .theme-toggle {
                justify-content: center;
                gap: 0;
                padding: 12px 8px;
            }

            .header {
                padding: 1rem;
            }

            .search-box {
                width: 150px;
            }

            .explore-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            .content {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const NexusApp = () => {
            const [darkMode, setDarkMode] = React.useState(true);
            const [currentPage, setCurrentPage] = React.useState('home');
            const [searchQuery, setSearchQuery] = React.useState('');
            const [activeChat, setActiveChat] = React.useState(null);
            const [profile, setProfile] = React.useState({
                name: 'Seu Perfil',
                handle: 'seuusuario',
                bio: 'Desenvolvedor apaixonado por tecnologia e inovação. Designer criativo e eterno aprendiz.',
                photo: null
            });
            const [editingProfile, setEditingProfile] = React.useState(false);
            const [editForm, setEditForm] = React.useState({});
            const photoInputRef = React.useRef(null);
            const mediaInputRef = React.useRef(null);

            // Create post state
            const [createText, setCreateText] = React.useState('');
            const [createMedia, setCreateMedia] = React.useState(null); // { url, type: 'image'|'video', name }
            const [createPostType, setCreatePostType] = React.useState('post'); // 'post' | 'story'
            const [published, setPublished] = React.useState(false);
            const [posts, setPosts] = React.useState([
                { id: 1, author: 'Sofia Rivera', avatar: 'SR', time: 'há 2 horas', icon: '🚀', text: 'Acaba de lançar um novo projeto de IA que vai revolucionar o mercado. Totalmente open-source e disponível para todos!', likes: 1240, comments: 89, media: null },
                { id: 2, author: 'Lucas Dev', avatar: 'LD', time: 'há 4 horas', icon: '💻', text: 'WebGL com Three.js é simplesmente incrível. Criei uma visualização 3D interativa de um sistema solar.', likes: 856, comments: 45, media: null },
                { id: 3, author: 'Marina Tech', avatar: 'MT', time: 'há 6 horas', icon: '🤖', text: 'Machine Learning não é mais futurista, é presente. Implementei um modelo que prevê tendências com 94% de acurácia.', likes: 2103, comments: 234, media: null }
            ]);
            const [likedPosts, setLikedPosts] = React.useState({});
            const [openComments, setOpenComments] = React.useState({});
            const [commentInputs, setCommentInputs] = React.useState({});
            const [comments, setComments] = React.useState({
                1: [{ id: 1, author: 'Lucas Dev', avatar: 'LD', text: 'Incrível iniciativa! Open-source é o futuro 🚀' }],
                2: [{ id: 1, author: 'Marina Tech', avatar: 'MT', text: 'Three.js é demais! Adorei o projeto.' }],
                3: []
            });
            const [sharePost, setSharePost] = React.useState(null);
            const [copiedLink, setCopiedLink] = React.useState(false);
            const [following, setFollowing] = React.useState({});

            const toggleComment = (id) => setOpenComments(p => ({ ...p, [id]: !p[id] }));

            const sendComment = (postId) => {
                const text = (commentInputs[postId] || '').trim();
                if (!text) return;
                const newC = { id: Date.now(), author: profile.name, avatar: profile.name.slice(0,2).toUpperCase(), avatarPhoto: profile.photo, text };
                setComments(p => ({ ...p, [postId]: [...(p[postId] || []), newC] }));
                setCommentInputs(p => ({ ...p, [postId]: '' }));
                setPosts(prev => prev.map(p => p.id === postId ? { ...p, comments: p.comments + 1 } : p));
            };

            const copyLink = () => {
                setCopiedLink(true);
                setTimeout(() => setCopiedLink(false), 2000);
            };

            const people = [
                { name: 'Sofia Rivera', handle: 'sofiadev', avatar: 'SR' },
                { name: 'Lucas Dev', handle: 'lucasdev', avatar: 'LD' },
                { name: 'Marina Tech', handle: 'marinatech', avatar: 'MT' },
                { name: 'Pedro Silva', handle: 'pedrosilva', avatar: 'PS' },
            ];

            const handleMediaSelect = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const url = URL.createObjectURL(file);
                const type = file.type.startsWith('video') ? 'video' : 'image';
                setCreateMedia({ url, type, name: file.name });
                e.target.value = '';
            };

            const publishPost = () => {
                if (!createText.trim() && !createMedia) return;
                const newPost = {
                    id: Date.now(),
                    author: profile.name,
                    avatar: profile.photo ? null : profile.name.slice(0, 2).toUpperCase(),
                    avatarPhoto: profile.photo,
                    time: 'agora mesmo',
                    icon: null,
                    text: createText,
                    likes: 0,
                    comments: 0,
                    media: createMedia
                };
                setPosts(prev => [newPost, ...prev]);
                setCreateText('');
                setCreateMedia(null);
                setPublished(true);
                setTimeout(() => { setPublished(false); setCurrentPage('home'); }, 1800);
            };

            const openEditProfile = () => {
                setEditForm({ name: profile.name, handle: profile.handle, bio: profile.bio, photo: profile.photo });
                setEditingProfile(true);
            };

            const saveProfile = () => {
                setProfile(editForm);
                setEditingProfile(false);
            };

            const handlePhotoChange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => setEditForm(f => ({ ...f, photo: ev.target.result }));
                reader.readAsDataURL(file);
            };
            const [chatInput, setChatInput] = React.useState('');
            const [conversations, setConversations] = React.useState({
                0: [
                    { id: 1, text: 'Ótimo projeto! Podemos colaborar?', sent: false, time: '14:20' },
                    { id: 2, text: 'Claro! Que tipo de colaboração você tem em mente?', sent: true, time: '14:22' },
                    { id: 3, text: 'Pensei em unir nossas ideias para o hackathon da próxima semana', sent: false, time: '14:23' },
                ],
                1: [
                    { id: 1, text: 'Você viu o código que compartilhei?', sent: false, time: '11:10' },
                    { id: 2, text: 'Vi sim! Muito elegante a solução do componente', sent: true, time: '11:15' },
                ],
                2: [
                    { id: 1, text: 'Convite para webinar amanhã', sent: false, time: '09:00' },
                ],
                3: [
                    { id: 1, text: 'Aprovou meu pull request!', sent: false, time: '08:45' },
                    { id: 2, text: 'Muito bem! O código ficou bem limpo 🎉', sent: true, time: '08:50' },
                ]
            });
            const messagesEndRef = React.useRef(null);

            React.useEffect(() => {
                if (messagesEndRef.current) {
                    messagesEndRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            }, [conversations, activeChat]);

            const sendMessage = () => {
                const text = chatInput.trim();
                if (!text || activeChat === null) return;
                const newMsg = { id: Date.now(), text, sent: true, time: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) };
                setConversations(prev => ({
                    ...prev,
                    [activeChat]: [...(prev[activeChat] || []), newMsg]
                }));
                setChatInput('');
            };

            const handleChatKeyDown = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            };

            React.useEffect(() => {
                document.body.className = darkMode ? '' : 'light';
            }, [darkMode]);

            const renderHeader = () => {
                const titles = {
                    home: 'Início',
                    explore: 'Explorar',
                    messages: 'Mensagens',
                    notifications: 'Notificações',
                    create: 'Criar',
                    profile: 'Perfil',
                    settings: 'Configurações'
                };
                return titles[currentPage] || 'Nexus';
            };

            const renderContent = () => {
                switch (currentPage) {
                    case 'home':
                        return (
                            <div className="home-layout">
                                {/* FEED */}
                                <div className="home-feed">
                                {posts.map(post => (
                                    <div key={post.id} className="post-card">
                                        <div className="post-header">
                                            <div className="post-avatar" style={{ overflow: 'hidden' }}>
                                                {post.avatarPhoto
                                                    ? <img src={post.avatarPhoto} style={{ width: '100%', height: '100%', objectFit: 'cover', borderRadius: '8px' }} />
                                                    : post.avatar
                                                }
                                            </div>
                                            <div className="post-meta">
                                                <div className="post-author">{post.author}</div>
                                                <div className="post-time">{post.time}</div>
                                            </div>
                                        </div>
                                        {post.media && post.media.type === 'image' && (
                                            <div className="post-image" style={{ padding: 0, overflow: 'hidden' }}>
                                                <img src={post.media.url} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                                            </div>
                                        )}
                                        {post.media && post.media.type === 'video' && (
                                            <div className="post-image" style={{ padding: 0, overflow: 'hidden' }}>
                                                <video src={post.media.url} controls style={{ width: '100%', maxHeight: '320px', objectFit: 'cover' }} />
                                            </div>
                                        )}
                                        {!post.media && post.icon && (
                                            <div className="post-image">{post.icon}</div>
                                        )}
                                        {post.text ? <div className="post-text">{post.text}</div> : null}
                                        <div className="post-actions">
                                            <button
                                                className={`action-btn ${likedPosts[post.id] ? 'active' : ''}`}
                                                onClick={() => setLikedPosts(p => ({ ...p, [post.id]: !p[post.id] }))}
                                            >
                                                {likedPosts[post.id] ? '❤️' : '🤍'} {post.likes + (likedPosts[post.id] ? 1 : 0)}
                                            </button>
                                            <button
                                                className={`action-btn ${openComments[post.id] ? 'active' : ''}`}
                                                onClick={() => toggleComment(post.id)}
                                            >
                                                💬 {(comments[post.id] || []).length + (post.comments - (post.id <= 3 ? (post.id === 1 ? 89 : post.id === 2 ? 45 : 234) : 0) + ((comments[post.id] || []).length))}
                                            </button>
                                            <button className="action-btn" onClick={() => setSharePost(post)}>
                                                🔁 Compartilhar
                                            </button>
                                        </div>

                                        {/* COMMENTS SECTION */}
                                        {openComments[post.id] && (
                                            <div className="comments-section">
                                                {(comments[post.id] || []).map(c => (
                                                    <div key={c.id} className="comment-item">
                                                        <div className="comment-avatar" style={{ overflow: 'hidden' }}>
                                                            {c.avatarPhoto
                                                                ? <img src={c.avatarPhoto} style={{ width: '100%', height: '100%', objectFit: 'cover', borderRadius: '6px' }} />
                                                                : c.avatar
                                                            }
                                                        </div>
                                                        <div className="comment-bubble">
                                                            <div className="comment-author">{c.author}</div>
                                                            <div className="comment-text">{c.text}</div>
                                                        </div>
                                                    </div>
                                                ))}
                                                <div className="comment-input-row">
                                                    <div className="comment-avatar" style={{ overflow: 'hidden' }}>
                                                        {profile.photo
                                                            ? <img src={profile.photo} style={{ width: '100%', height: '100%', objectFit: 'cover', borderRadius: '6px' }} />
                                                            : profile.name.slice(0,2).toUpperCase()
                                                        }
                                                    </div>
                                                    <input
                                                        className="comment-input"
                                                        placeholder="Escreva um comentário..."
                                                        value={commentInputs[post.id] || ''}
                                                        onChange={e => setCommentInputs(p => ({ ...p, [post.id]: e.target.value }))}
                                                        onKeyDown={e => e.key === 'Enter' && sendComment(post.id)}
                                                    />
                                                    <button
                                                        className="comment-send"
                                                        onClick={() => sendComment(post.id)}
                                                        disabled={!(commentInputs[post.id] || '').trim()}
                                                    >➤</button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                ))}
                                </div>

                                {/* RIGHT SIDEBAR — Pessoas */}
                                <div className="home-right">
                                    <div className="home-right-card">
                                        <div className="rs-section-title">Quem seguir</div>
                                        {people.map((p, i) => (
                                            <div key={i} className="rs-person">
                                                <div className="rs-avatar">{p.avatar}</div>
                                                <div className="rs-person-info">
                                                    <div className="rs-person-name">{p.name}</div>
                                                    <div className="rs-person-handle">@{p.handle}</div>
                                                </div>
                                                <button
                                                    className={`rs-follow-btn ${following[i] ? 'following' : ''}`}
                                                    onClick={() => setFollowing(f => ({ ...f, [i]: !f[i] }))}
                                                >
                                                    {following[i] ? '✓ Seguindo' : 'Seguir'}
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="home-right-card">
                                        <div className="rs-section-title">Online agora</div>
                                        {people.slice(0,3).map((p, i) => (
                                            <div key={i} className="rs-person" onClick={() => { setActiveChat(i); setCurrentPage('messages'); }}>
                                                <div style={{ position: 'relative' }}>
                                                    <div className="rs-avatar">{p.avatar}</div>
                                                    <div style={{ position: 'absolute', bottom: 0, right: 0, width: 10, height: 10, borderRadius: '50%', background: '#22c55e', border: '2px solid #1a1a1a' }}></div>
                                                </div>
                                                <div className="rs-person-info">
                                                    <div className="rs-person-name">{p.name}</div>
                                                    <div className="rs-person-handle" style={{ color: '#22c55e', fontSize: 11 }}>● Online</div>
                                                </div>
                                                <span style={{ fontSize: 16, color: '#555' }}>✉</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        );

                    case 'create':
                        return (
                            <div className="create-page">
                                {published && (
                                    <div className="feed-published">
                                        <span style={{ fontSize: 20 }}>✅</span>
                                        <span>Post publicado! Redirecionando para o feed...</span>
                                    </div>
                                )}

                                <div className="create-type-tabs">
                                    {[{ id: 'post', label: 'Post', icon: '📝' }, { id: 'story', label: 'Story', icon: '⚡' }].map(t => (
                                        <button key={t.id} className={`create-type-tab ${createPostType === t.id ? 'active' : ''}`} onClick={() => setCreatePostType(t.id)}>
                                            <span>{t.icon}</span>{t.label}
                                        </button>
                                    ))}
                                </div>

                                <div className="create-card">
                                    <div className="create-top">
                                        <div className="post-avatar" style={{ overflow: 'hidden', flexShrink: 0 }}>
                                            {profile.photo
                                                ? <img src={profile.photo} style={{ width: '100%', height: '100%', objectFit: 'cover', borderRadius: '8px' }} />
                                                : profile.name.slice(0, 2).toUpperCase()
                                            }
                                        </div>
                                        <textarea
                                            className="create-textarea"
                                            placeholder={createPostType === 'story' ? 'O que está acontecendo agora?' : 'Compartilhe algo com sua rede...'}
                                            value={createText}
                                            onChange={e => setCreateText(e.target.value)}
                                            maxLength={500}
                                            rows={3}
                                        />
                                    </div>

                                    {createMedia && (
                                        <div className="create-media-preview">
                                            {createMedia.type === 'image'
                                                ? <img src={createMedia.url} alt="preview" />
                                                : <video src={createMedia.url} controls />
                                            }
                                            <button className="create-media-remove" onClick={() => setCreateMedia(null)}>✕</button>
                                        </div>
                                    )}

                                    <hr className="create-divider" />

                                    <div className="create-toolbar">
                                        <button className="create-tool-btn" onClick={() => { mediaInputRef.current.accept = 'image/*'; mediaInputRef.current.click(); }}>
                                            <span className="create-tool-icon">🖼️</span> Foto
                                        </button>
                                        <button className="create-tool-btn" onClick={() => { mediaInputRef.current.accept = 'video/*'; mediaInputRef.current.click(); }}>
                                            <span className="create-tool-icon">🎬</span> Vídeo
                                        </button>
                                        <button className="create-tool-btn" onClick={() => { mediaInputRef.current.accept = 'image/*,video/*'; mediaInputRef.current.click(); }}>
                                            <span className="create-tool-icon">📎</span> Arquivo
                                        </button>
                                        <input ref={mediaInputRef} type="file" style={{ display: 'none' }} onChange={handleMediaSelect} />
                                    </div>

                                    <div className="create-actions">
                                        <span className={`create-char-count ${createText.length > 450 ? 'over' : createText.length > 350 ? 'warn' : ''}`}>
                                            {createText.length}/500
                                        </span>
                                        <button
                                            className="create-submit-btn"
                                            onClick={publishPost}
                                            disabled={!createText.trim() && !createMedia}
                                        >
                                            {createPostType === 'story' ? '⚡ Publicar Story' : '🚀 Publicar'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        );

                    case 'explore':
                        return (
                            <div className="explore-grid">
                                {[
                                    { icon: '🔬', title: 'Tecnologia', users: '12.5K pessoas' },
                                    { icon: '🎨', title: 'Design', users: '8.3K pessoas' },
                                    { icon: '📱', title: 'Mobile Dev', users: '15.2K pessoas' },
                                    { icon: '🧠', title: 'IA & ML', users: '9.8K pessoas' },
                                    { icon: '🌐', title: 'Web Dev', users: '18.5K pessoas' },
                                    { icon: '⚡', title: 'DevOps', users: '6.7K pessoas' },
                                    { icon: '🔐', title: 'Segurança', users: '7.2K pessoas' },
                                    { icon: '📊', title: 'Data Science', users: '10.1K pessoas' }
                                ].map((item, i) => (
                                    <div key={i} className="explore-card">
                                        <div className="explore-image">{item.icon}</div>
                                        <div className="explore-info">
                                            <div className="explore-title">{item.title}</div>
                                            <div className="explore-users">{item.users}</div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        );

                    case 'messages': {
                        const contacts = [
                            { name: 'Sofia Rivera', avatar: 'SR', text: 'Ótimo projeto! Podemos colaborar?' },
                            { name: 'Lucas Dev', avatar: 'LD', text: 'Você viu o código que compartilhei?' },
                            { name: 'Marina Tech', avatar: 'MT', text: 'Convite para webinar amanhã' },
                            { name: 'Pedro Silva', avatar: 'PS', text: 'Aprovou meu pull request!' }
                        ];
                        const activeMsgs = activeChat !== null ? (conversations[activeChat] || []) : [];
                        const activeContact = activeChat !== null ? contacts[activeChat] : null;
                        return (
                            <div className="chat-layout" style={{ height: 'calc(100vh - 100px)' }}>
                                {/* Lista de contatos */}
                                <div className="chat-contacts">
                                    {contacts.map((c, i) => {
                                        const msgs = conversations[i] || [];
                                        const last = msgs[msgs.length - 1];
                                        return (
                                            <div
                                                key={i}
                                                className={`chat-contact-item ${activeChat === i ? 'active' : ''}`}
                                                onClick={() => setActiveChat(i)}
                                            >
                                                <div className="message-avatar">{c.avatar}</div>
                                                <div className="chat-contact-info">
                                                    <div className="chat-contact-name">{c.name}</div>
                                                    <div className="chat-contact-preview">{last ? last.text : c.text}</div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                {/* Janela de chat */}
                                {activeChat === null ? (
                                    <div className="chat-no-selection">
                                        <div className="chat-no-selection-icon">✉</div>
                                        <div>Selecione uma conversa para começar</div>
                                    </div>
                                ) : (
                                    <div className="chat-window">
                                        {/* Cabeçalho */}
                                        <div className="chat-header">
                                            <div className="message-avatar">{activeContact.avatar}</div>
                                            <div>
                                                <div className="chat-header-name">{activeContact.name}</div>
                                                <div className="chat-header-status">● Online</div>
                                            </div>
                                        </div>

                                        {/* Mensagens */}
                                        <div className="chat-messages">
                                            {activeMsgs.length === 0 ? (
                                                <div className="chat-empty">
                                                    <div className="chat-empty-icon">💬</div>
                                                    <div className="chat-empty-text">Nenhuma mensagem ainda. Diga olá!</div>
                                                </div>
                                            ) : (
                                                activeMsgs.map(msg => (
                                                    <div key={msg.id} className={`chat-bubble ${msg.sent ? 'sent' : 'received'}`}>
                                                        {msg.text}
                                                        <div className="chat-bubble-time">{msg.time}</div>
                                                    </div>
                                                ))
                                            )}
                                            <div ref={messagesEndRef} />
                                        </div>

                                        {/* Input */}
                                        <div className="chat-input-area">
                                            <textarea
                                                className="chat-input"
                                                placeholder="Digite uma mensagem..."
                                                value={chatInput}
                                                onChange={e => setChatInput(e.target.value)}
                                                onKeyDown={handleChatKeyDown}
                                                rows={1}
                                            />
                                            <button
                                                className="chat-send-btn"
                                                onClick={sendMessage}
                                                disabled={!chatInput.trim()}
                                            >
                                                ➤
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        );
                    }

                    case 'notifications':
                        return (
                            <div className="messages-list">
                                {[
                                    { name: 'Sofia curtiu seu post', avatar: 'SR', icon: '❤️' },
                                    { name: 'Lucas comentou: Excelente trabalho!', avatar: 'LD', icon: '💬' },
                                    { name: 'Marina começou a te seguir', avatar: 'MT', icon: '👤' },
                                    { name: 'Pedro reagiu com um like', avatar: 'PS', icon: '👍' }
                                ].map((notif, i) => (
                                    <div key={i} className="message-item">
                                        <div className="message-avatar">{notif.avatar}</div>
                                        <div className="message-content">
                                            <div className="message-name">{notif.name}</div>
                                        </div>
                                        <div style={{ fontSize: '20px' }}>{notif.icon}</div>
                                    </div>
                                ))}
                            </div>
                        );

                    case 'profile':
                        return (
                            <div style={{ maxWidth: '600px', margin: '0 auto' }}>
                                <div className="profile-header">
                                    <div className="profile-avatar" style={{ cursor: 'pointer' }} onClick={openEditProfile}>
                                        {profile.photo
                                            ? <img src={profile.photo} style={{ width: '100%', height: '100%', objectFit: 'cover', borderRadius: '50%' }} />
                                            : profile.name.slice(0, 2).toUpperCase()
                                        }
                                    </div>
                                    <div className="profile-name">{profile.name}</div>
                                    <div className="profile-handle">@{profile.handle}</div>
                                    <div className="profile-bio">{profile.bio}</div>
                                    <button className="profile-btn" onClick={openEditProfile}>Editar Perfil</button>
                                </div>
                                <div className="profile-stats">
                                    <div className="stat-box">
                                        <div className="stat-number">1.2K</div>
                                        <div className="stat-label">Seguidores</div>
                                    </div>
                                    <div className="stat-box">
                                        <div className="stat-number">345</div>
                                        <div className="stat-label">Seguindo</div>
                                    </div>
                                    <div className="stat-box">
                                        <div className="stat-number">89</div>
                                        <div className="stat-label">Posts</div>
                                    </div>
                                </div>
                            </div>
                        );

                    case 'settings':
                        return (
                            <div style={{ maxWidth: '600px' }}>
                                <div className="settings-list">
                                    {[
                                        { label: 'Notificações', toggled: true },
                                        { label: 'Email', toggled: false },
                                        { label: 'Perfil Privado', toggled: false },
                                        { label: 'Mostrar Online', toggled: true },
                                        { label: 'Mostrar Atividade', toggled: true }
                                    ].map((item, i) => (
                                        <div key={i} className="settings-item">
                                            <span className="settings-label">{item.label}</span>
                                            <div className={`toggle ${item.toggled ? 'on' : ''}`}>
                                                <div className="toggle-dot"></div>
                                            </div>
                                        </div>
                                    ))}
                                    <div className="settings-item" onClick={() => alert('Você será desconectado')}>
                                        <span className="settings-label" style={{ color: '#ff4757' }}>Sair da Conta</span>
                                        <span>→</span>
                                    </div>
                                </div>
                            </div>
                        );

                    default:
                        return null;
                }
            };

            return (
                <div className="app">
                    {/* SHARE MODAL */}
                    {sharePost && (
                        <div className="share-modal-overlay" onClick={e => e.target === e.currentTarget && setSharePost(null)}>
                            <div className="share-modal">
                                <div className="share-modal-title">Compartilhar post</div>
                                <div className="share-preview">
                                    "{sharePost.text ? sharePost.text.slice(0, 80) + (sharePost.text.length > 80 ? '...' : '') : 'Post de ' + sharePost.author}"
                                </div>
                                <div className="share-options">
                                    {[
                                        { icon: '💬', label: 'WhatsApp' },
                                        { icon: '✉️', label: 'Mensagem' },
                                        { icon: '🐦', label: 'Twitter/X' },
                                        { icon: '📘', label: 'Facebook' },
                                    ].map((opt, i) => (
                                        <button key={i} className="share-option" onClick={() => setSharePost(null)}>
                                            <span style={{ fontSize: 20 }}>{opt.icon}</span>
                                            {opt.label}
                                        </button>
                                    ))}
                                </div>
                                <div className="share-link-row">
                                    <input className="share-link-input" readOnly value={`https://nexus.app/post/${sharePost.id}`} />
                                    <button className="share-copy-btn" onClick={copyLink}>
                                        {copiedLink ? '✓ Copiado!' : 'Copiar link'}
                                    </button>
                                </div>
                                <button className="share-close" onClick={() => setSharePost(null)}>Fechar</button>
                            </div>
                        </div>
                    )}

                    {/* EDIT PROFILE MODAL */}
                    {editingProfile && (
                        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setEditingProfile(false)}>
                            <div className="modal-box">
                                <div className="modal-title">Editar Perfil</div>

                                <div className="edit-photo-area">
                                    <div className="edit-avatar" onClick={() => photoInputRef.current.click()}>
                                        {editForm.photo
                                            ? <img src={editForm.photo} />
                                            : (editForm.name || '?').slice(0, 2).toUpperCase()
                                        }
                                        <div className="edit-avatar-overlay">📷</div>
                                    </div>
                                    <div className="edit-photo-hint">Clique na foto para trocar</div>
                                    <input
                                        ref={photoInputRef}
                                        type="file"
                                        accept="image/*"
                                        style={{ display: 'none' }}
                                        onChange={handlePhotoChange}
                                    />
                                </div>

                                <div className="edit-field">
                                    <div className="edit-label">Nome</div>
                                    <input
                                        className="edit-input"
                                        value={editForm.name || ''}
                                        onChange={e => setEditForm(f => ({ ...f, name: e.target.value }))}
                                        placeholder="Seu nome"
                                    />
                                </div>

                                <div className="edit-field">
                                    <div className="edit-label">Usuário</div>
                                    <div className="edit-handle-prefix">
                                        <span>@</span>
                                        <input
                                            value={editForm.handle || ''}
                                            onChange={e => setEditForm(f => ({ ...f, handle: e.target.value.replace(/\s/g, '').toLowerCase() }))}
                                            placeholder="seuusuario"
                                        />
                                    </div>
                                </div>

                                <div className="edit-field">
                                    <div className="edit-label">Bio</div>
                                    <textarea
                                        className="edit-input"
                                        value={editForm.bio || ''}
                                        onChange={e => setEditForm(f => ({ ...f, bio: e.target.value }))}
                                        placeholder="Fale um pouco sobre você..."
                                    />
                                </div>

                                <div className="modal-actions">
                                    <button className="btn-cancel" onClick={() => setEditingProfile(false)}>Cancelar</button>
                                    <button className="btn-save" onClick={saveProfile}>Salvar alterações</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* SIDEBAR */}
                    <div className="sidebar">
                        <div className="logo">
                            <div className="logo-icon">◆</div>
                            <span>Nexus</span>
                        </div>

                        <nav className="nav-list">
                            {[
                                { id: 'home', label: 'Início' },
                                { id: 'explore', label: 'Explorar' },
                                { id: 'messages', label: 'Mensagens' },
                                { id: 'notifications', label: 'Notificações' },
                                { id: 'create', label: 'Criar' },
                                { id: 'profile', label: 'Perfil' }
                            ].map(item => (
                                <button
                                    key={item.id}
                                    className={`nav-btn ${currentPage === item.id ? 'active' : ''}`}
                                    onClick={() => setCurrentPage(item.id)}
                                    title={item.label}
                                >
                                    <span className="nav-icon">
                                        {{
                                            home: '⌂',
                                            explore: '◉',
                                            messages: '✉',
                                            notifications: '⚬',
                                            create: '✚',
                                            profile: '◎'
                                        }[item.id]}
                                    </span>
                                    <span>{item.label}</span>
                                </button>
                            ))}
                        </nav>

                        <div className="sidebar-bottom">
                            <div className="user-profile" onClick={() => setCurrentPage('profile')}>
                                <div className="user-avatar" style={{ overflow: 'hidden' }}>
                                    {profile.photo
                                        ? <img src={profile.photo} style={{ width: '100%', height: '100%', objectFit: 'cover', borderRadius: '50%' }} />
                                        : profile.name.slice(0, 1).toUpperCase()
                                    }
                                </div>
                                <div className="user-info">
                                    <div className="user-name">{profile.name}</div>
                                    <div className="user-handle">@{profile.handle}</div>
                                </div>
                            </div>
                            <button className="theme-toggle" onClick={() => setDarkMode(!darkMode)}>
                                <span>{darkMode ? '○' : '●'}</span>
                                <span>{darkMode ? 'Claro' : 'Escuro'}</span>
                            </button>
                        </div>
                    </div>

                    {/* MAIN */}
                    <div className="main">
                        <div className="header">
                            <div className="header-title">{renderHeader()}</div>
                            {currentPage === 'home' && (
                                <input
                                    type="text"
                                    className="search-box"
                                    placeholder="Buscar..."
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                />
                            )}
                        </div>

                        <div className="content" style={currentPage === 'messages' ? { padding: '1rem', overflow: 'hidden' } : {}}>
                            {renderContent()}
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<NexusApp />, document.getElementById('root'));
    </script>
</body>
</html>
